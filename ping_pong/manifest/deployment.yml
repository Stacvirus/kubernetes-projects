apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-count-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: requestcount
  template:
    metadata:
      labels:
        app: requestcount
    spec:
      volumes:
        - name: log-volume
          persistentVolumeClaim:
            claimName: log-claim # this is the name of the volume claim we created
      containers:
        - name: pingpong
          image: ping-pong:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
          - name: log-volume
            mountPath: /usr/src/app/files
          env:
            - name: HASH_FILE_PATH
              value: "/usr/src/app/files/hashes.log"
        - name: logoutput
          image: log-output-go:latest 
          imagePullPolicy: IfNotPresent
          volumeMounts:
          - name: log-volume
            mountPath: /usr/src/app/files
          env:
            - name: HASH_FILE_PATH
              value: "/usr/src/app/files/hashes.log"